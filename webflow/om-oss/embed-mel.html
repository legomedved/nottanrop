<svg class="oo-mel__svg" viewBox="0 0 400 400" role="img" aria-labelledby="mel-t">
            <title id="mel-t">Melangeren sett ovenfra. Trommelen snurrer, to granittsteiner holdes på plass og maler nøttene til smør.</title>
            <defs>
              <pattern id="ht" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3.5" cy="3.5" r="1.5" fill="#1B1108"/></pattern>
              <pattern id="ht-fine" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="2.5" cy="2.5" r=".9" fill="#1B1108"/></pattern>
              <pattern id="nuts" width="54" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
                <rect width="54" height="46" fill="#F5E0C6"/>
                <g fill="#C49A6C" stroke="#1B1108" stroke-width="1.6">
                  <path d="M6 14c4-8 16-9 20-2-3 7-14 9-20 2z"/>
                  <path d="M30 34c4-8 16-9 20-2-3 7-14 9-20 2z" transform="rotate(38 40 33)"/>
                  <path d="M4 38c3-6 12-7 15-1-2 5-10 7-15 1z" transform="rotate(-30 11 37)"/>
                  <path d="M34 10c3-6 12-7 15-1-2 5-10 7-15 1z" transform="rotate(70 41 9)"/>
                </g>
                <g stroke="#1B1108" stroke-width=".9" opacity=".6"><path d="M10 13h12"/><path d="M33 32l11 5"/></g>
              </pattern>
              <pattern id="meal" width="14" height="14" patternUnits="userSpaceOnUse">
                <rect width="14" height="14" fill="#E2C09A"/>
                <circle cx="3" cy="3" r="2" fill="#C49A6C"/><circle cx="10" cy="6" r="1.6" fill="#5A3A1C"/>
                <circle cx="6" cy="11" r="1.4" fill="#C49A6C"/><circle cx="12" cy="12" r="1" fill="#F5E0C6"/>
              </pattern>
              <pattern id="granite" width="18" height="18" patternUnits="userSpaceOnUse">
                <rect width="18" height="18" fill="#C8C5C2"/>
                <circle cx="4" cy="5" r="1.7" fill="#646261"/><circle cx="12" cy="10" r="1.2" fill="#FBF7F3"/>
                <circle cx="8" cy="15" r="1.1" fill="#4B4A48"/><circle cx="15" cy="3" r="1" fill="#646261"/>
              </pattern>
              <clipPath id="bowl"><circle cx="200" cy="200" r="156"/></clipPath>
              <clipPath id="sa"><rect x="262" y="150" width="82" height="100" rx="22"/></clipPath>
              <clipPath id="sb"><rect x="56" y="150" width="82" height="100" rx="22"/></clipPath>
            </defs>

            <!-- plate 1: flat spot colour, offset 3,2 against the ink (misregistration) -->
            <g transform="translate(3 2)">
              <circle cx="200" cy="200" r="186" fill="#C8C5C2"/>
              <circle cx="200" cy="200" r="168" fill="#EEEBE8"/>
            </g>
            <!-- halftone: shadow side, lower right -->
            <path d="M372 210a172 172 0 0 1-330 60 186 186 0 0 0 330-60z" fill="url(#ht)" opacity=".55"/>

            <g class="oo-mel__drum">
              <g clip-path="url(#bowl)">
                <circle cx="200" cy="200" r="156" fill="url(#granite)"/>
                <circle class="oo-mel__layer" data-stage="0" cx="200" cy="200" r="156" fill="url(#nuts)"/>
                <circle class="oo-mel__layer" data-stage="1" cx="200" cy="200" r="156" fill="url(#meal)" opacity="0"/>
                <circle class="oo-mel__layer" data-stage="2" cx="200" cy="200" r="156" fill="#C49A6C" opacity="0"/>
                <circle class="oo-mel__layer" data-stage="3" cx="200" cy="200" r="156" fill="#5A3A1C" opacity="0"/>
                <g class="oo-mel__layer" data-stage="swirl" fill="none" stroke="#F5E0C6" stroke-width="3.2" stroke-linecap="round" opacity="0">
                  <path d="M200 66a134 134 0 0 1 134 134"/><path d="M200 334a134 134 0 0 1-134-134"/>
                  <path d="M120 120a112 112 0 0 1 80-34"/><path d="M280 280a112 112 0 0 1-80 34"/>
                  <path d="M200 114a86 86 0 0 1 86 86"/><path d="M200 286a86 86 0 0 1-86-86"/>
                </g>
                <path d="M356 200a156 156 0 0 1-286 86 170 170 0 0 0 286-86z" fill="url(#ht-fine)" opacity=".35"/>
              </g>
              <!-- drum ink -->
              <circle cx="200" cy="200" r="156" fill="none" stroke="#1B1108" stroke-width="3"/>
              <g stroke="#1B1108" stroke-width="2" opacity=".8">
                <path d="M200 30v10M370 200h-10M200 370v-10M30 200h10M320 80l-7 7M80 320l7-7M320 320l-7-7M80 80l7 7"/>
              </g>
            </g>

            <!-- the stones and the arm stand still; the drum turns under them -->
            <g transform="rotate(-18 200 200)">
              <g transform="translate(3 2)">
                <rect x="262" y="150" width="82" height="100" rx="22" fill="url(#granite)"/>
                <rect x="56" y="150" width="82" height="100" rx="22" fill="url(#granite)"/>
              </g>
              <g clip-path="url(#sa)"><g class="oo-mel__roll" stroke="#1B1108" stroke-opacity=".45" stroke-width="2"><path d="M262 126h82M262 140h82M262 154h82M262 168h82M262 182h82M262 196h82M262 210h82M262 224h82M262 238h82M262 252h82M262 266h82"/></g></g>
              <g clip-path="url(#sb)"><g class="oo-mel__roll" stroke="#1B1108" stroke-opacity=".45" stroke-width="2"><path d="M56 126h82M56 140h82M56 154h82M56 168h82M56 182h82M56 196h82M56 210h82M56 224h82M56 238h82M56 252h82M56 266h82"/></g></g>
              <rect x="300" y="150" width="44" height="100" rx="20" fill="url(#ht)" opacity=".35"/>
              <rect x="94" y="150" width="44" height="100" rx="20" fill="url(#ht)" opacity=".35"/>
              <g fill="none" stroke="#1B1108" stroke-width="3">
                <rect x="262" y="150" width="82" height="100" rx="22"/>
                <rect x="56" y="150" width="82" height="100" rx="22"/>
              </g>
              <rect x="64" y="193" width="272" height="14" rx="7" fill="#EEEBE8" stroke="#1B1108" stroke-width="2.6"/>
              <circle cx="200" cy="200" r="20" fill="#C8C5C2" stroke="#1B1108" stroke-width="3"/>
              <circle cx="200" cy="200" r="7" fill="#FF7A2A" stroke="#1B1108" stroke-width="2"/>
            </g>
            <!-- scraper -->
            <g transform="rotate(118 200 200)">
              <path d="M200 182V60" stroke="#1B1108" stroke-width="12" stroke-linecap="round"/>
              <path d="M200 182V60" stroke="#C8C5C2" stroke-width="6" stroke-linecap="round"/>
              <path d="M186 58h28" stroke="#1B1108" stroke-width="7" stroke-linecap="round"/>
            </g>
          </svg>
          <div class="oo-spot" style="left:84%;top:14%">
            <button type="button" aria-expanded="false" aria-controls="tip-1"><span aria-hidden="true">+</span>Trommelen</button>
            <div class="oo-spot__tip" id="tip-1" hidden>Rustfritt stål med granittbunn. Den snurrer. Hele døgnet.</div>
          </div>
          <div class="oo-spot" style="left:12%;top:58%">
            <button type="button" aria-expanded="false" aria-controls="tip-2"><span aria-hidden="true">+</span>Steinene</button>
            <div class="oo-spot__tip" id="tip-2" hidden>To granittsteiner. De holdes på plass og ruller mot bunnen. Ingen meninger, bare press.</div>
          </div>
          <div class="oo-spot" style="left:30%;top:16%">
            <button type="button" aria-expanded="false" aria-controls="tip-3"><span aria-hidden="true">+</span>Skrapen</button>
            <div class="oo-spot__tip" id="tip-3" hidden>Skyver massen tilbake under steinene, så ingenting slipper unna.</div>
          </div>
